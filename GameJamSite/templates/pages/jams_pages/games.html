{% extends 'base.html' %}
{% load static %}

{% block head %}
<link rel="stylesheet" href="{% static 'css/form.css' %}">
<link rel="stylesheet" href="{% static 'css/sidebar.css' %}">
<link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
{% endblock %}

{% block sidebar %}
<div class="space"></div>

{% endblock %}

{% block content %}
<!-- Блок списка игр -->
<div class="main-container">
    <div class="row">
        {% for game in games %}
            <div class="col-md-4 mb-4">
                <div class="card">
                    <a href="{% url 'game_page' slug=game.slug %}">
                        {% if game.image %}
                            <img src="{{ game.image.url }}" style="height: 190px; object-fit: cover; width: 100%;"  class="card-img-top" style="padding: 3%">
                        {% else %}
                            <img src="{% static 'img/logo.png' %}" class="card-img-top" style="padding: 3%">
                        {% endif %}
                    </a>
                    <div class="card-body">
                        <div>
                            <a href="{% url 'game_page' slug=game.slug %}" class="card-title">{{ game.title }}</a>
                            <p class="card-text">{{ game.user }}</p>
                        </div>
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
</div>
<script>
    const inputs = document.querySelectorAll('input');
    inputs.forEach(input => {
        input.addEventListener('focus', function() {
            const label = this.previousElementSibling;
            label.classList.add('label-up');
        });
        input.addEventListener('blur', function() {
            const label = this.previousElementSibling;
            if (this.value.trim() === '') {
                label.classList.remove('label-up');
            }
        });
    });
</script>
{% endblock %}
